[package]
name = "oass"
version = "0.2.0"
description = "A modern AI terminal for Windows"
authors = ["Oass"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "oass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oass"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
keyring = { version = "4.1.6", default-features = false, features = ["v1"] }
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
